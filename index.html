<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diatom Guy Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #000;
    width: 100vw;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Scene 1 ---- */
  #scene1 {
    position: absolute;
    inset: 0;
    transition: opacity 0.6s ease;
  }

  #scene1-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #diatom-guy {
    position: absolute;
    left: 8%;
    bottom: 10%;
    height: 35%;
    z-index: 2;
    transition: opacity 0.3s ease;
  }

  #diatom-guy-with-hat {
    position: absolute;
    left: 8%;
    bottom: 10%;
    height: 35%;
    z-index: 2;
    display: none;
    cursor: grab;
  }

  #hat {
    position: absolute;
    left: 5%;
    bottom: 38%;
    height: 14%;
    z-index: 3;
    cursor: pointer;
    animation: bob 2s ease-in-out infinite;
  }

  #door {
    position: absolute;
    right: 10%;
    bottom: 8%;
    height: 45%;
    z-index: 2;
    display: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes bobSlow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .bobbing {
    animation: bobSlow 2.5s ease-in-out infinite;
  }

  /* ---- Scene 2 ---- */
  #scene2 {
    position: absolute;
    inset: 0;
    display: none;
    background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
  }

  #scene2-house {
    position: absolute;
    left: 8%;
    bottom: 10%;
    height: 70%;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #scene2-diatom {
    position: absolute;
    left: 18%;
    bottom: 10%;
    height: 30%;
    z-index: 3;
    opacity: 0;
    transition: opacity 0.6s ease;
    animation: bobSlow 2.5s ease-in-out infinite;
  }

  #scene2-car {
    position: absolute;
    left: 50%;
    bottom: 6%;
    height: 18%;
    transform: translateX(-50%);
    z-index: 4;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #scene2-car-with-driver {
    position: absolute;
    left: 50%;
    bottom: 6%;
    height: 18%;
    transform: translateX(-50%);
    z-index: 4;
    display: none;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    10% { transform: translateX(-50%) translateY(-1px) rotate(-0.5deg); }
    20% { transform: translateX(-50%) translateY(1px) rotate(0.5deg); }
    30% { transform: translateX(-50%) translateY(-1px) rotate(-0.3deg); }
    40% { transform: translateX(-50%) translateY(1px) rotate(0.3deg); }
    50% { transform: translateX(-50%) translateY(-1px) rotate(-0.5deg); }
    60% { transform: translateX(-50%) translateY(1px) rotate(0.5deg); }
    70% { transform: translateX(-50%) translateY(-1px) rotate(-0.3deg); }
    80% { transform: translateX(-50%) translateY(1px) rotate(0.3deg); }
    90% { transform: translateX(-50%) translateY(-1px) rotate(-0.5deg); }
  }

  @keyframes driveOff {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(120vw); }
  }

  /* Stars for scene 2 background */
  #scene2::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 55% 5%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 50% 25%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 90% 28%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 35% 35%, rgba(255,255,255,0.6), transparent);
    z-index: 0;
  }

  /* Ground for scene 2 */
  #scene2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 12%;
    background: linear-gradient(to bottom, #1a1a2e, #111);
    z-index: 1;
  }

  /* Drag visual feedback */
  .dragging {
    cursor: grabbing !important;
    opacity: 0.85;
    z-index: 100 !important;
  }

  /* Door glow hint when dragging */
  .door-glow {
    filter: drop-shadow(0 0 15px rgba(255, 220, 100, 0.8));
  }

  /* ---- Room Scene ---- */
  #room-scene {
    position: absolute;
    inset: 0;
  }

  #room-bg {
    position: absolute;
    display: block;
  }

  .room-object {
    position: absolute;
    z-index: 2;
  }

  /* Debug: visible outline around background bounds */
  .debug-outline {
    outline: 2px dashed rgba(0, 255, 0, 0.7);
    outline-offset: -1px;
  }

  /* Debug: anchor-point markers */
  .debug-marker {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 99;
    pointer-events: none;
  }
  .debug-marker::after {
    content: attr(data-label);
    position: absolute;
    left: 14px;
    top: -4px;
    font: 11px/1 monospace;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 2px 4px;
    border-radius: 2px;
    white-space: nowrap;
  }

  /* Thought bubbles */
  .thought-dot {
    position: absolute;
    background: #fff;
    border: 1px solid #000;
    border-radius: 50%;
    z-index: 3;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  #room-thought-bubble {
    position: absolute;
    background: #fff;
    border: none;
    border-radius: 50%;
    z-index: 3;
    opacity: 0;
    transition: opacity 0.3s ease;
    /* Cloud shape via overlapping radial shadows.
       Order: white lobes (top) → black lobe outlines → base outline (bottom).
       White lobes cover the base outline at intersections, so only
       the outer edge of the combined cloud shape shows a border. */
    box-shadow:
      calc(var(--bw) *  0.28) calc(var(--bw) * -0.22) 0 calc(var(--bw) * 0.06) #fff,
      calc(var(--bw) * -0.28) calc(var(--bw) * -0.18) 0 calc(var(--bw) * 0.04) #fff,
      calc(var(--bw) *  0.32) calc(var(--bw) *  0.12) 0 calc(var(--bw) * 0.03) #fff,
      calc(var(--bw) * -0.30) calc(var(--bw) *  0.10) 0 calc(var(--bw) * 0.02) #fff,
      calc(var(--bw) *  0.10) calc(var(--bw) * -0.30) 0 calc(var(--bw) * 0.05) #fff,
      calc(var(--bw) * -0.12) calc(var(--bw) * -0.28) 0 calc(var(--bw) * 0.04) #fff,
      /* outline layer (slightly larger, behind white) */
      calc(var(--bw) *  0.28) calc(var(--bw) * -0.22) 0 calc(var(--bw) * 0.06 + 1px) #000,
      calc(var(--bw) * -0.28) calc(var(--bw) * -0.18) 0 calc(var(--bw) * 0.04 + 1px) #000,
      calc(var(--bw) *  0.32) calc(var(--bw) *  0.12) 0 calc(var(--bw) * 0.03 + 1px) #000,
      calc(var(--bw) * -0.30) calc(var(--bw) *  0.10) 0 calc(var(--bw) * 0.02 + 1px) #000,
      calc(var(--bw) *  0.10) calc(var(--bw) * -0.30) 0 calc(var(--bw) * 0.05 + 1px) #000,
      calc(var(--bw) * -0.12) calc(var(--bw) * -0.28) 0 calc(var(--bw) * 0.04 + 1px) #000,
      /* base circle outline (behind everything) */
      0 0 0 1px #000;
  }

  #room-fish {
    position: absolute;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  @keyframes fishPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes hatPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
</style>
</head>
<body>
<div id="game">

  <!-- Room Scene (Background-1 interaction) -->
  <div id="room-scene">
    <img id="room-bg" src="assets/Background-1.png" alt="Room background">
    <img id="room-bed-cat" class="room-object" src="assets/Cat-open-eye.png" alt="Cat on bed">
    <img id="room-hat" class="room-object" src="assets/Hat-1.png" alt="Hat on wall">
    <img id="room-stand-cat" class="room-object" src="assets/Cat-stand.png" alt="Standing cat" style="display:none">
    <img id="room-stand-cat-hat" class="room-object" src="assets/Cat-stand-with-hat.png" alt="Standing cat with hat" style="display:none">
    <div id="room-thought-dot-1" class="thought-dot"></div>
    <div id="room-thought-dot-2" class="thought-dot"></div>
    <div id="room-thought-bubble"></div>
    <img id="room-fish" src="assets/Fish.png" alt="Fish">
  </div>

  <!-- Scene 1 (hidden while building room scene) -->
  <div id="scene1" style="display:none">
    <img id="scene1-bg" src="assets/inside-scene2.jpg" alt="Inside scene background">
    <img id="diatom-guy" src="assets/diatom-guy.png" alt="Diatom Guy">
    <img id="diatom-guy-with-hat" src="assets/diatom-guy-with-hat.png" alt="Diatom Guy with Hat">
    <img id="hat" src="assets/hat.png" alt="Hat">
    <img id="door" src="assets/door.png" alt="Door">
  </div>

  <!-- Scene 2 -->
  <div id="scene2">
    <img id="scene2-house" src="assets/house.png" alt="House">
    <img id="scene2-diatom" src="assets/diatom-guy-with-hat.png" alt="Diatom Guy with Hat">
    <img id="scene2-car" src="assets/car.png" alt="Car">
    <img id="scene2-car-with-driver" src="assets/car-with-driver.png" alt="Car with Driver">
  </div>

</div>

<script>
// ============================================================
// CONFIG — all tuneable values for the room interaction scene.
// Coordinates use % relative to the Background-1 bounds
// (which is scaled to bgScale and centred on stage).
// ============================================================
const CONFIG = {
  // --- Stage ---
  stageWidth:  window.innerWidth,
  stageHeight: window.innerHeight,

  // --- Background ---
  bgScale: 0.5,   // Background-1 rendered at 50% of its native size

  // --- Object anchors (centre of sprite, % of background bounds) ---
  bedCatAnchor:   { x: 0.10, y: 0.67 },  // cat reading on bed (lowered)
  hatAnchor:      { x: 0.505, y: 0.33 }, // hat on wall hanger hook
  standCatAnchor: { x: 0.52, y: 0.72 },  // cat standing near cabinet

  // --- Thought bubble anchors (bg-relative, centre of element) ---
  thoughtDot1Anchor:    { x: 0.16, y: 0.53 },
  thoughtDot2Anchor:    { x: 0.19, y: 0.46 },
  thoughtBubbleAnchor:  { x: 0.24, y: 0.35 },
  fishAnchor:           { x: 0.24, y: 0.35 },

  // --- Object sizes (height as fraction of background height) ---
  objectScale: {
    bedCat:   0.252,
    hat:      0.12,
    standCat: 0.27,
    fish:     0.09,
  },

  // --- Thought bubble sizes (fraction of bg height) ---
  thoughtDot1Size:    0.02,
  thoughtDot2Size:    0.035,
  thoughtBubbleSize:  0.11,

  // --- Door trigger zone (% of background bounds) ---
  doorZone: { x: 0.85, y: 0.08, width: 0.13, height: 0.72 },

  // --- Timing (ms unless noted) ---
  timing: {
    blinkInterval:  3000,  // ms between cat blinks
    blinkDuration:   200,  // ms eyes stay closed
    bubbleDelay:    1500,  // ms before speech/thought bubble appears
    pulseSpeed:      800,  // ms per pulse cycle for interactive hints
    bubbleStagger:   400,  // ms between each thought element appearing
    sceneFade:       600,  // ms for scene fade transitions
  },

  // --- Debug ---
  debugMode: false,  // set true to show hit-boxes & anchor markers
};

(function () {
  // ---- Element references ----
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  const diatomGuy = document.getElementById('diatom-guy');
  const diatomGuyWithHat = document.getElementById('diatom-guy-with-hat');
  const hat = document.getElementById('hat');
  const door = document.getElementById('door');

  const scene2House = document.getElementById('scene2-house');
  const scene2Diatom = document.getElementById('scene2-diatom');
  const scene2Car = document.getElementById('scene2-car');
  const scene2CarWithDriver = document.getElementById('scene2-car-with-driver');

  // ---- Scene 1: Hat click ----
  hat.addEventListener('click', function () {
    // Hide the plain diatom guy and the hat
    diatomGuy.style.display = 'none';
    hat.style.display = 'none';

    // Show diatom guy with hat, bobbing
    diatomGuyWithHat.style.display = 'block';
    diatomGuyWithHat.classList.add('bobbing');

    // Show the door with a fade in
    door.style.display = 'block';
    // Force reflow so transition fires
    door.offsetHeight;
    door.style.opacity = '1';
  });

  // ---- Scene 1: Drag diatom-guy-with-hat to door ----
  let isDragging = false;
  let dragOffsetX = 0;
  let dragOffsetY = 0;

  function startDrag(e) {
    if (diatomGuyWithHat.style.display === 'none') return;
    isDragging = true;
    diatomGuyWithHat.classList.add('dragging');
    diatomGuyWithHat.classList.remove('bobbing');

    const rect = diatomGuyWithHat.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragOffsetX = clientX - rect.left;
    dragOffsetY = clientY - rect.top;

    // Switch to absolute positioning from pointer
    diatomGuyWithHat.style.bottom = 'auto';
    diatomGuyWithHat.style.left = rect.left + 'px';
    diatomGuyWithHat.style.top = rect.top + 'px';

    e.preventDefault();
  }

  function moveDrag(e) {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    diatomGuyWithHat.style.left = (clientX - dragOffsetX) + 'px';
    diatomGuyWithHat.style.top = (clientY - dragOffsetY) + 'px';

    // Check proximity to door for glow effect
    if (door.style.display !== 'none') {
      const doorRect = door.getBoundingClientRect();
      const diatomRect = diatomGuyWithHat.getBoundingClientRect();
      const dist = getDistance(diatomRect, doorRect);
      if (dist < 80) {
        door.classList.add('door-glow');
      } else {
        door.classList.remove('door-glow');
      }
    }

    e.preventDefault();
  }

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    diatomGuyWithHat.classList.remove('dragging');

    // Check overlap with door
    const doorRect = door.getBoundingClientRect();
    const diatomRect = diatomGuyWithHat.getBoundingClientRect();
    const dist = getDistance(diatomRect, doorRect);

    if (dist < 80) {
      // Transition to Scene 2
      transitionToScene2();
    } else {
      // Snap back
      diatomGuyWithHat.style.left = '8%';
      diatomGuyWithHat.style.top = '';
      diatomGuyWithHat.style.bottom = '10%';
      diatomGuyWithHat.classList.add('bobbing');
    }

    door.classList.remove('door-glow');
  }

  function getDistance(r1, r2) {
    const cx1 = r1.left + r1.width / 2;
    const cy1 = r1.top + r1.height / 2;
    const cx2 = r2.left + r2.width / 2;
    const cy2 = r2.top + r2.height / 2;
    return Math.sqrt((cx1 - cx2) ** 2 + (cy1 - cy2) ** 2);
  }

  diatomGuyWithHat.addEventListener('mousedown', startDrag);
  diatomGuyWithHat.addEventListener('touchstart', startDrag);
  document.addEventListener('mousemove', moveDrag);
  document.addEventListener('touchmove', moveDrag, { passive: false });
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);

  // ---- Transition to Scene 2 ----
  function transitionToScene2() {
    // Fade out scene 1
    scene1.style.opacity = '0';

    setTimeout(function () {
      scene1.style.display = 'none';
      scene2.style.display = 'block';

      // Stagger the scene 2 elements appearing
      setTimeout(function () {
        scene2House.style.opacity = '1';
      }, 200);

      setTimeout(function () {
        scene2Diatom.style.opacity = '1';
      }, 600);

      setTimeout(function () {
        scene2Car.style.opacity = '1';
      }, 1000);
    }, 600);
  }

  // ---- Scene 2: Car click ----
  scene2Car.addEventListener('click', function () {
    // Hide diatom guy
    scene2Diatom.style.transition = 'opacity 0.4s ease';
    scene2Diatom.style.opacity = '0';

    setTimeout(function () {
      scene2Diatom.style.display = 'none';

      // Swap car for car with driver
      const carRect = scene2Car.getBoundingClientRect();
      scene2Car.style.display = 'none';

      scene2CarWithDriver.style.display = 'block';
      scene2CarWithDriver.style.left = scene2Car.style.left || '50%';
      scene2CarWithDriver.style.bottom = scene2Car.style.bottom || '6%';

      // Shake the car
      scene2CarWithDriver.style.animation = 'shake 0.15s ease-in-out infinite';

      // After 1 second, drive off screen to the right
      setTimeout(function () {
        scene2CarWithDriver.style.animation = 'driveOff 1.5s ease-in forwards';
      }, 1000);
    }, 400);
  });
})();

// ============================================================
// ROOM SCENE — Background-1 scaled to 50 % of stage, centred.
// Objects placed relative to background bounds.
// ============================================================
(function () {
  const roomBg             = document.getElementById('room-bg');
  const roomBedCat         = document.getElementById('room-bed-cat');
  const roomHat            = document.getElementById('room-hat');
  const roomStandCat       = document.getElementById('room-stand-cat');
  const roomScene          = document.getElementById('room-scene');
  const roomThoughtDot1    = document.getElementById('room-thought-dot-1');
  const roomThoughtDot2    = document.getElementById('room-thought-dot-2');
  const roomThoughtBubble  = document.getElementById('room-thought-bubble');
  const roomFish           = document.getElementById('room-fish');
  const roomStandCatHat    = document.getElementById('room-stand-cat-hat');

  // ---- Scene state ----
  var roomState = 'idle';  // 'idle' | 'thinking' | 'fishReady' | 'standing' | 'hatReady' | 'gettingHat' | 'dragReady'

  // bgBounds: the computed pixel rect of Background-1 on screen.
  // All room objects will be placed relative to this.
  let bgBounds = { x: 0, y: 0, w: 0, h: 0 };

  // Expose for future modules & console debugging
  window.bgBounds = bgBounds;

  // ---- Place a single object relative to bgBounds ----
  // anchor = {x,y} in 0..1 bg-local coords (centre of sprite)
  // heightFrac = sprite height as fraction of bg height
  function placeObject(el, anchor, heightFrac) {
    if (!el || !bgBounds.w) return;
    var natW = el.naturalWidth;
    var natH = el.naturalHeight;
    if (!natW || !natH) return;

    var h = bgBounds.h * heightFrac;
    var w = h * (natW / natH);

    // Anchor = centre of sprite in bg-local coords → screen px
    var cx = bgBounds.x + bgBounds.w * anchor.x;
    var cy = bgBounds.y + bgBounds.h * anchor.y;

    el.style.width  = Math.round(w) + 'px';
    el.style.height = Math.round(h) + 'px';
    el.style.left   = Math.round(cx - w / 2) + 'px';
    el.style.top    = Math.round(cy - h / 2) + 'px';
  }

  // ---- Place a circle div (no naturalWidth) relative to bgBounds ----
  function placeCircle(el, anchor, sizeFrac) {
    if (!el || !bgBounds.w) return;
    var size = bgBounds.h * sizeFrac;
    var cx = bgBounds.x + bgBounds.w * anchor.x;
    var cy = bgBounds.y + bgBounds.h * anchor.y;
    el.style.width  = Math.round(size) + 'px';
    el.style.height = Math.round(size) + 'px';
    el.style.left   = Math.round(cx - size / 2) + 'px';
    el.style.top    = Math.round(cy - size / 2) + 'px';
  }

  // ---- Layout background ----
  function layoutBackground() {
    var sw = window.innerWidth;
    var sh = window.innerHeight;
    CONFIG.stageWidth  = sw;
    CONFIG.stageHeight = sh;

    var natW = roomBg.naturalWidth;
    var natH = roomBg.naturalHeight;
    if (!natW || !natH) return;

    // Target box is bgScale of the stage
    var maxW = sw * CONFIG.bgScale;
    var maxH = sh * CONFIG.bgScale;

    // Fit (contain) the image inside that box
    var scale = Math.min(maxW / natW, maxH / natH);
    var w = Math.round(natW * scale);
    var h = Math.round(natH * scale);

    // Centre on stage
    var x = Math.round((sw - w) / 2);
    var y = Math.round((sh - h) / 2);

    bgBounds.x = x;
    bgBounds.y = y;
    bgBounds.w = w;
    bgBounds.h = h;

    roomBg.style.left   = x + 'px';
    roomBg.style.top    = y + 'px';
    roomBg.style.width  = w + 'px';
    roomBg.style.height = h + 'px';

    // Debug outline on bg
    if (CONFIG.debugMode) {
      roomBg.classList.add('debug-outline');
    } else {
      roomBg.classList.remove('debug-outline');
    }
  }

  // ---- Layout all room objects ----
  function layoutObjects() {
    placeObject(roomBedCat,   CONFIG.bedCatAnchor,   CONFIG.objectScale.bedCat);
    placeObject(roomHat,      CONFIG.hatAnchor,       CONFIG.objectScale.hat);
    placeObject(roomStandCat,    CONFIG.standCatAnchor,  CONFIG.objectScale.standCat);
    placeObject(roomStandCatHat, CONFIG.standCatAnchor,  CONFIG.objectScale.standCat);
    layoutBubbles();
  }

  // ---- Layout thought bubbles + fish (positions even when hidden) ----
  function layoutBubbles() {
    placeCircle(roomThoughtDot1,   CONFIG.thoughtDot1Anchor,   CONFIG.thoughtDot1Size);
    placeCircle(roomThoughtDot2,   CONFIG.thoughtDot2Anchor,   CONFIG.thoughtDot2Size);
    placeCircle(roomThoughtBubble, CONFIG.thoughtBubbleAnchor, CONFIG.thoughtBubbleSize);
    // Set --bw so cloud box-shadows scale with bubble size
    var bubbleSize = bgBounds.h * CONFIG.thoughtBubbleSize;
    roomThoughtBubble.style.setProperty('--bw', Math.round(bubbleSize) + 'px');
    placeObject(roomFish,          CONFIG.fishAnchor,          CONFIG.objectScale.fish);
  }

  // ---- Debug markers ----
  var markers = [];

  function updateDebugMarkers() {
    // Remove old markers
    markers.forEach(function (m) { m.remove(); });
    markers = [];

    if (!CONFIG.debugMode || !bgBounds.w) return;

    var anchors = [
      { anchor: CONFIG.bedCatAnchor,   color: '#ff4488', label: 'bedCat'   },
      { anchor: CONFIG.hatAnchor,      color: '#ffdd00', label: 'hat'      },
      { anchor: CONFIG.standCatAnchor, color: '#44ddff', label: 'standCat' },
    ];

    anchors.forEach(function (a) {
      var dot = document.createElement('div');
      dot.className = 'debug-marker';
      dot.style.background = a.color;
      dot.style.left = Math.round(bgBounds.x + bgBounds.w * a.anchor.x) + 'px';
      dot.style.top  = Math.round(bgBounds.y + bgBounds.h * a.anchor.y) + 'px';
      dot.setAttribute('data-label', a.label);
      roomScene.appendChild(dot);
      markers.push(dot);
    });

    console.log(
      '[Room DEBUG] stage: ' + CONFIG.stageWidth + 'x' + CONFIG.stageHeight +
      '  |  bg: x=' + bgBounds.x + ' y=' + bgBounds.y +
      ' w=' + bgBounds.w + ' h=' + bgBounds.h
    );
  }

  // ---- Bed cat blink loop ----
  var blinkTimer = null;
  var SRC_OPEN  = 'assets/Cat-open-eye.png';
  var SRC_CLOSE = 'assets/Cat-close-eye.png';

  // Preload closed-eye image so the swap is instant
  var preloadClose = new Image();
  preloadClose.src = SRC_CLOSE;

  function doBlink() {
    roomBedCat.src = SRC_CLOSE;
    setTimeout(function () {
      roomBedCat.src = SRC_OPEN;
    }, CONFIG.timing.blinkDuration);
  }

  function startBlink() {
    stopBlink();
    blinkTimer = setInterval(doBlink, CONFIG.timing.blinkInterval);
  }

  function stopBlink() {
    if (blinkTimer) {
      clearInterval(blinkTimer);
      blinkTimer = null;
    }
    roomBedCat.src = SRC_OPEN;
  }

  // Expose for future steps
  window.startBlink = startBlink;
  window.stopBlink  = stopBlink;

  // ---- Bed cat click → thought bubble sequence ----
  roomBedCat.style.cursor = 'pointer';

  roomBedCat.addEventListener('click', function () {
    if (roomState !== 'idle') return;
    roomState = 'thinking';
    stopBlink();
    showThoughtSequence();
  });

  function showThoughtSequence() {
    var s = CONFIG.timing.bubbleStagger;

    setTimeout(function () {
      roomThoughtDot1.style.opacity = '1';
    }, s);

    setTimeout(function () {
      roomThoughtDot2.style.opacity = '1';
    }, s * 2);

    setTimeout(function () {
      roomThoughtBubble.style.opacity = '1';
    }, s * 3);

    setTimeout(function () {
      roomFish.style.opacity = '1';
      roomFish.style.cursor = 'pointer';
      roomFish.style.animation = 'fishPulse ' + CONFIG.timing.pulseSpeed + 'ms ease-in-out infinite';
      roomState = 'fishReady';
    }, s * 3 + 500);
  }

  // ---- Fish click → standing cat + hat pulses ----
  roomFish.addEventListener('click', function () {
    if (roomState !== 'fishReady') return;
    roomState = 'standing';

    // Hide bed cat
    roomBedCat.style.transition = 'opacity 0.3s ease';
    roomBedCat.style.opacity = '0';

    // Hide thought bubbles + fish
    roomThoughtDot1.style.opacity = '0';
    roomThoughtDot2.style.opacity = '0';
    roomThoughtBubble.style.opacity = '0';
    roomFish.style.opacity = '0';
    roomFish.style.animation = '';

    setTimeout(function () {
      roomBedCat.style.display = 'none';
      roomThoughtDot1.style.display = 'none';
      roomThoughtDot2.style.display = 'none';
      roomThoughtBubble.style.display = 'none';
      roomFish.style.display = 'none';

      // Show standing cat
      roomStandCat.style.display = 'block';
      roomStandCat.style.opacity = '0';
      roomStandCat.style.transition = 'opacity 0.4s ease';
      // Force reflow
      roomStandCat.offsetHeight;
      roomStandCat.style.opacity = '1';

      // Start hat pulsing
      roomHat.style.cursor = 'pointer';
      roomHat.style.animation = 'hatPulse ' + CONFIG.timing.pulseSpeed + 'ms ease-in-out infinite';
      roomState = 'hatReady';
    }, 400);
  });

  // ---- Hat click → cat gets hat (crossfade to avoid body flicker) ----
  roomHat.addEventListener('click', function () {
    if (roomState !== 'hatReady') return;
    roomState = 'gettingHat';

    // Stop hat pulse
    roomHat.style.animation = '';

    // Fade out hat on wall
    roomHat.style.transition = 'opacity 0.6s ease';
    roomHat.style.opacity = '0';

    // Layer Cat-stand-with-hat exactly over Cat-stand, fade it in.
    // Cat-stand stays visible underneath → no body flicker.
    roomStandCatHat.style.display = 'block';
    roomStandCatHat.style.opacity = '0';
    roomStandCatHat.style.transition = 'opacity 0.6s ease';
    roomStandCatHat.offsetHeight; // force reflow
    roomStandCatHat.style.opacity = '1';

    setTimeout(function () {
      roomHat.style.display = 'none';
      roomState = 'dragReady';
    }, 700);
  });

  // Expose state for future steps
  window.getRoomState = function () { return roomState; };

  // ---- Full layout pass ----
  function layout() {
    layoutBackground();
    layoutObjects();
    updateDebugMarkers();
  }

  // Expose console helper
  window.debug = function () {
    console.table({
      stage:      { width: CONFIG.stageWidth, height: CONFIG.stageHeight },
      bgBounds:   { x: bgBounds.x, y: bgBounds.y, width: bgBounds.w, height: bgBounds.h },
      bgScale:    { value: CONFIG.bgScale },
      bedCat:     CONFIG.bedCatAnchor,
      hat:        CONFIG.hatAnchor,
      standCat:   CONFIG.standCatAnchor,
    });
  };

  // ---- Init: wait for ALL images to load before layout ----
  var images = [roomBg, roomBedCat, roomHat, roomStandCat, roomStandCatHat, roomFish];
  var loaded = 0;
  var total  = images.length;

  function onImageReady() {
    loaded++;
    if (loaded >= total) {
      layout();
      startBlink();
    }
  }

  images.forEach(function (img) {
    if (img.complete && img.naturalWidth) {
      onImageReady();
    } else {
      img.addEventListener('load', onImageReady);
    }
  });

  window.addEventListener('resize', layout);
})();
</script>
</body>
</html>
